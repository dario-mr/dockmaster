apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp
  namespace: kubernetes-dashboard
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${HEADLAMP_DOMAIN}`)
      kind: Rule
      services:
        - name: headlamp
          port: 80
      middlewares:
        - name: crowdsec-bouncer
          namespace: apps
        - name: dariolab-cors
          namespace: apps
        - name: rate-limit-global
          namespace: apps
  tls:
    store:
      name: default
      namespace: kube-system
