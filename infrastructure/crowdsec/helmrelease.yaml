apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: crowdsec
      version: "0.24.2"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: crowdsec-agent
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: crowdsec-agent
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-for-lapi-and-register
                        command:
                          - sh
                          - -ec
                          - |
                            until nc "$LAPI_HOST" "$LAPI_PORT" -z; do
                              echo waiting for lapi to start
                              sleep 5
                            done
                            ln -s /staging/etc/crowdsec /etc/crowdsec
                            if [ -s /tmp_config/local_api_credentials.yaml ]; then
                              cp /tmp_config/local_api_credentials.yaml /etc/crowdsec/local_api_credentials.yaml
                              cscli lapi status
                            else
                              # A lost emptyDir must not collide with the pod's previous registration.
                              cscli lapi register --machine "$USERNAME-$(cat /proc/sys/kernel/random/uuid)" -u "$LAPI_URL" --token "$REGISTRATION_TOKEN"
                              cp /etc/crowdsec/local_api_credentials.yaml /tmp_config/local_api_credentials.yaml.tmp
                              mv /tmp_config/local_api_credentials.yaml.tmp /tmp_config/local_api_credentials.yaml
                            fi
  values:
    container_runtime: containerd

    config:
      profiles.yaml: |
        name: default_ip_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
        decisions:
          - type: ban
        on_success: break
        ---
        name: default_range_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Range"
        duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
        decisions:
          - type: ban
        on_success: break

    lapi:
      env:
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: enroll-key
        - name: ENROLL_INSTANCE_NAME
          value: "dariolab-k3s"
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: bouncer-key
      persistentVolume:
        data:
          enabled: true
          existingClaim: crowdsec-db-pvc-longhorn
          size: 1Gi
        config:
          enabled: true
          existingClaim: crowdsec-config-pvc-longhorn
          size: 100Mi
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi

    agent:
      isDeployment: false
      additionalAcquisition:
        - source: file
          filenames:
            - /var/log/traefik/access.log
          labels:
            type: traefik
      volumes:
        - name: traefik-logs
          hostPath:
            path: /var/log/traefik
            type: DirectoryOrCreate
      volumeMounts:
        - name: traefik-logs
          mountPath: /var/log/traefik
          readOnly: true
      extraVolumes:
        - name: whitelist
          configMap:
            name: crowdsec-whitelist
      extraVolumeMounts:
        - name: whitelist
          mountPath: /etc/crowdsec/parsers/s02-enrich/my-whitelist.yaml
          subPath: my-whitelist.yaml
          readOnly: true
        - name: whitelist
          mountPath: /etc/crowdsec/parsers/s02-enrich/headlamp-whitelist.yaml
          subPath: headlamp-whitelist.yaml
          readOnly: true
        - name: whitelist
          mountPath: /etc/crowdsec/parsers/s02-enrich/inactive-apps-whitelist.yaml
          subPath: inactive-apps-whitelist.yaml
          readOnly: true
      env:
        - name: COLLECTIONS
          value: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
