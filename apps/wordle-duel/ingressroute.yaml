apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wordle-duel
  namespace: apps
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${WORDLE_DUEL_DOMAIN}`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: wordle-duel
          port: 80
      middlewares:
        - name: crowdsec-bouncer
        - name: dariolab-cors
        - name: default-headers
        - name: rate-limit-app
  tls:
    store:
      name: default
      namespace: kube-system
