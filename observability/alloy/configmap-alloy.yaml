apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: |
    // ----------- Loki sink -----------
    loki.write "default" {
    	endpoint {
    		url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
    	}
    }

    // ----------- Traefik access logs (from log file) -----------
    loki.process "traefik_access" {
        forward_to = [loki.write.default.receiver]

        stage.label_drop {
            values = ["filename"]
        }

    	// Parse top-level JSON from Traefik access logs
    	stage.json {
    		expressions = {
    			duration     = "Duration",
    			remote_ip    = "ClientHost",
    			uri          = "RequestPath",
    			status       = "OriginStatus",
    			size         = "OriginContentSize",
    			start_utc    = "StartUTC",
    		}
    	}

    	// Enrich with GeoIP data (latitude, longitude, country, city)
    	stage.geoip {
    		source  = "remote_ip"
    		db      = "/var/lib/geoipupdate/GeoLite2-City.mmdb"
    		db_type = "city"
    	}

        stage.timestamp {
            source = "start_utc"
            format = "RFC3339Nano"
        }

        // Pack fields needed by the access dashboard.
        stage.pack {
            labels = [
                "uri",
                "remote_ip",
                "status",
                "size",
                "duration",
                "geoip_city_name",
                "geoip_country_name",
                "geoip_location_latitude",
                "geoip_location_longitude",
            ]
            ingest_timestamp = false
        }
    }

    loki.source.file "traefik_access" {
    	targets = [{
    		__path__ = "/var/log/traefik/access.log",
    		host     = "${DOMAIN}",
    		job      = "traefik_access",
    	}]
    	forward_to    = [loki.process.traefik_access.receiver]
    	tail_from_end = true
    }

    // ----------- Kubernetes pod logs -----------
    discovery.kubernetes "pod_logs" {
    	role = "pod"
    }

    discovery.relabel "pod_logs" {
    	targets = discovery.kubernetes.pod_logs.targets

    	rule {
    		source_labels = ["__meta_kubernetes_pod_node_name"]
    		target_label  = "__host__"
    	}

    	rule {
    		source_labels = ["__meta_kubernetes_namespace"]
    		target_label  = "namespace"
    	}

    	rule {
    		source_labels = ["__meta_kubernetes_pod_label_app"]
    		target_label  = "app"
    	}

    	rule {
    		source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
    		target_label  = "__tmp_app_name"
    	}

    	// Use app.kubernetes.io/name as fallback if app label is empty
        rule {
            source_labels = ["app", "__tmp_app_name"]
            regex         = ";(.+)"
            target_label  = "app"
        }

        // Filter targets before tailing them; the process pipeline only handles parsing.
        rule {
            source_labels = ["app"]
            regex         = "^(grafana|kube-prometheus-stack-grafana|prometheus|kube-prometheus-stack-prometheus|alloy|wordle-duel-service|wordle-duel-service-redis)$"
            action        = "keep"
        }

        rule {
            source_labels = ["__meta_kubernetes_pod_name"]
    		target_label  = "pod"
    	}

    	rule {
    		source_labels = ["__meta_kubernetes_pod_container_name"]
    		target_label  = "container"
    	}

    	rule {
    		target_label = "job"
    		replacement  = "pod_logs"
    	}
    }

    loki.source.kubernetes "pod_logs" {
    	targets       = discovery.relabel.pod_logs.output
    	forward_to    = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
    	forward_to = [loki.write.default.receiver]

    	// Drop Kubernetes health-check probe logs (noisy, no value)
    	stage.drop {
    		expression = "kube-probe/"
    	}

    // Plain-text apps (Redis)
    stage.match {
        selector = "{app=\"wordle-duel-service-redis\"}"

        stage.template {
            source   = "msg"
            template = `{{ .Entry }}`
        }
    }

    // Grafana
    stage.match {
        selector = "{app=~\"grafana|kube-prometheus-stack-grafana\", container=\"grafana\"}"

        stage.logfmt {
            mapping = {
                ts     = "t",
                level  = "level",
                logger = "logger",
                msg    = "msg",
    				error  = "error",
    				query  = "query",
    			}
    		}
    }

    stage.match {
        selector = "{app=~\"grafana|kube-prometheus-stack-grafana\", container=~\"grafana-sc-(datasources|dashboard)\"}"

        stage.json {
            expressions = {
                ts     = "time",
                level  = "level",
                msg    = "msg",
            }
        }
    }

    	// Alloy (regex instead of logfmt: Alloy emits quoted keys like "start time" that break logfmt)
    	stage.match {
    		selector = "{app=\"alloy\", container=\"alloy\"}"

    		stage.regex {
    			expression = `^ts=(?P<ts>\S+)\s+level=(?P<level>\S+)\s+msg="(?P<msg>[^"]*)"(?:\s+component_path=\S+)?(?:\s+component_id=(?P<component_id>\S+))?`
    		}

    }

    	// Prometheus
    	stage.match {
    		selector = "{app=~\"prometheus|kube-prometheus-stack-prometheus\", container=\"prometheus\"}"

    		stage.logfmt {
            mapping = {ts = "time", level = "level", msg = "msg"}
            }
        }

    	// JSON apps (Spring Boot)
    	stage.match {
    		selector = "{app=~\"wordle-duel-service\"}"

            // Keep non-JSON lines intact before the JSON parser runs.
            stage.template {
                source   = "raw"
                template = `{{ .Entry }}`
            }

            // JVM warnings are plain text, so recover their severity for Grafana.
            stage.regex {
                expression = `^(?P<raw_level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL)\b`
            }

        stage.json {
            expressions = {level = "level", logger = "logger_name", msg = "message", ts = "[\"@timestamp\"] || timestamp || time || ts", stack_trace = "stack_trace", trace_id = "traceId"}
        }

            stage.template {
                source   = "level"
                template = `{{ if .level }}{{ .level }}{{ else if eq .raw_level "WARNING" }}WARN{{ else if .raw_level }}{{ .raw_level }}{{ else }}INFO{{ end }}`
            }

            stage.template {
                source   = "msg"
                template = `{{ default .raw .msg }}`
            }

    }

        // Normalize fields shared by all retained application formats.
        stage.template {
            source   = "level"
            template = `{{ default "INFO" .level }}`
        }

        stage.labels {
            values = {level = null}
        }

        stage.timestamp {
            source             = "ts"
            format             = "RFC3339Nano"
            action_on_failure  = "skip"
        }

        stage.pack {
            labels = ["msg", "logger", "error", "query", "component_id", "stack_trace", "trace_id"]
            ingest_timestamp = false
        }
    }
